openapi: 3.1.0
info:
  title: Engagement Platform API
  version: 1.0.0
  description: |
    Versioned REST API supporting the first six public pages:
    authentication, homepage, mission search, NGO directory,
    skills-sponsorship submission and offer details.
servers:
  - url: http://localhost:8000/api/v1
    description: Local
tags:
  - name: Authentication
  - name: Homepage
  - name: Offers
  - name: Organizations
  - name: Sponsorship
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Exchange credentials for a Sanctum token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/register/candidate:
    post:
      tags: [Authentication]
      summary: Register a candidate account
      operationId: registerCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateRegistrationRequest'
      responses:
        '201':
          description: Candidate created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/User'}
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/register/organization:
    post:
      tags: [Authentication]
      summary: Register an organization and its owner
      operationId: registerOrganization
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationRegistrationRequest'
      responses:
        '201':
          description: Organization created in pending verification
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Send a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '200':
          description: Neutral response
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset a password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: {type: string, format: email}
                token: {type: string}
                password: {type: string, minLength: 10}
                password_confirmation: {type: string}
      responses:
        '200':
          description: Password reset
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      security: [{sanctum: []}]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke current token
      security: [{sanctum: []}]
      responses:
        '200':
          description: Logged out
  /home:
    get:
      tags: [Homepage]
      summary: Get homepage data
      operationId: getHomepage
      responses:
        '200':
          description: Homepage payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [stats, featured_offers, coverage_countries]
                    properties:
                      stats:
                        type: object
                        properties:
                          open_offers: {type: integer}
                          verified_organizations: {type: integer}
                          candidate_price: {type: string}
                      featured_offers:
                        type: array
                        items: {$ref: '#/components/schemas/OfferSummary'}
                      coverage_countries:
                        type: array
                        items: {$ref: '#/components/schemas/Country'}
                      sponsor:
                        anyOf:
                          - {$ref: '#/components/schemas/SponsorSlot'}
                          - {type: 'null'}
  /offers:
    get:
      tags: [Offers]
      summary: Search and filter published offers
      operationId: listOffers
      parameters:
        - {$ref: '#/components/parameters/SearchQuery'}
        - name: location
          in: query
          schema: {type: string, maxLength: 150}
        - name: country
          in: query
          schema: {type: string, minLength: 2, maxLength: 2}
        - name: city
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {$ref: '#/components/schemas/EngagementType'}
        - name: cause
          in: query
          schema: {type: string}
        - name: mode[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: '#/components/schemas/RemoteMode'}
        - name: duration
          in: query
          schema: {type: string, enum: [short, medium, long]}
        - name: language
          in: query
          schema: {type: string}
        - name: experience_level
          in: query
          schema: {type: string, enum: [junior, confirmed, senior, expert, governance]}
        - name: sort
          in: query
          schema: {type: string, enum: [relevance, recent, oldest, proximity], default: relevance}
        - name: lat
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: lng
          in: query
          schema: {type: number, minimum: -180, maximum: 180}
        - name: radius_km
          in: query
          schema: {type: integer, minimum: 1, maximum: 500}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated offer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOffers'
        '422':
          $ref: '#/components/responses/ValidationError'
  /offers/{slug}:
    get:
      tags: [Offers]
      summary: Get one published offer
      operationId: getOffer
      parameters:
        - $ref: '#/components/parameters/OfferSlug'
      responses:
        '200':
          description: Complete offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Offer'}
        '404':
          $ref: '#/components/responses/NotFound'
  /offers/{slug}/similar:
    get:
      tags: [Offers]
      summary: Get similar offers
      parameters:
        - $ref: '#/components/parameters/OfferSlug'
      responses:
        '200':
          description: Similar offers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/OfferSummary'}
  /offers/{slug}/share:
    post:
      tags: [Offers]
      summary: Record a share event
      parameters:
        - $ref: '#/components/parameters/OfferSlug'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [copy_link, email, linkedin, facebook, whatsapp, other]
      responses:
        '200':
          description: Event recorded
        '422':
          $ref: '#/components/responses/ValidationError'
  /offers/{slug}/applications:
    post:
      tags: [Offers]
      summary: Apply to an offer
      security: [{sanctum: []}]
      parameters:
        - $ref: '#/components/parameters/OfferSlug'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cover_letter: {type: string, maxLength: 10000}
                cv: {type: string, format: binary}
      responses:
        '201':
          description: Application created
        '200':
          description: Existing application returned idempotently
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /offers/{slug}/saved:
    put:
      tags: [Offers]
      summary: Save an offer
      security: [{sanctum: []}]
      parameters:
        - $ref: '#/components/parameters/OfferSlug'
      responses:
        '200': {description: Saved}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
    delete:
      tags: [Offers]
      summary: Remove a saved offer
      security: [{sanctum: []}]
      parameters:
        - $ref: '#/components/parameters/OfferSlug'
      responses:
        '200': {description: Removed}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations:
    get:
      tags: [Organizations]
      summary: Search the public organization directory
      parameters:
        - {$ref: '#/components/parameters/SearchQuery'}
        - name: country
          in: query
          schema: {type: string, minLength: 2, maxLength: 2}
        - name: cause
          in: query
          schema: {type: string}
        - name: verification[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string, enum: [verified, certified_plus]}
        - name: type
          in: query
          schema: {type: string, enum: [association, foundation, ngo, waqf]}
        - name: size
          in: query
          schema: {type: string, enum: [micro, small, medium, large]}
        - name: sort
          in: query
          schema: {type: string, enum: [relevance, name, offers]}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PerPage'}
      responses:
        '200':
          description: Paginated directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizations'
  /organizations/{slug}:
    get:
      tags: [Organizations]
      summary: Get a public organization profile
      parameters:
        - $ref: '#/components/parameters/OrganizationSlug'
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/Organization'}
        '404':
          $ref: '#/components/responses/NotFound'
  /sponsorship-missions:
    post:
      tags: [Sponsorship]
      summary: Submit a skills-sponsorship mission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SponsorshipMissionRequest'
      responses:
        '201':
          description: Mission accepted pending email verification
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  data: {$ref: '#/components/schemas/SponsorshipMission'}
                  debug_verification_token:
                    anyOf: [{type: string}, {type: 'null'}]
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /sponsorship-missions/{trackingUuid}:
    get:
      tags: [Sponsorship]
      summary: Track a sponsorship mission
      parameters:
        - $ref: '#/components/parameters/TrackingUuid'
        - name: token
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Mission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SponsorshipMission'}
        '403':
          $ref: '#/components/responses/Forbidden'
  /sponsorship-missions/{trackingUuid}/verify:
    post:
      tags: [Sponsorship]
      summary: Verify the representative email
      parameters:
        - $ref: '#/components/parameters/TrackingUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/SponsorshipMission'}
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  parameters:
    SearchQuery:
      name: q
      in: query
      schema: {type: string, maxLength: 150}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    PerPage:
      name: per_page
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 12}
    OfferSlug:
      name: slug
      in: path
      required: true
      schema: {type: string}
    OrganizationSlug:
      name: slug
      in: path
      required: true
      schema: {type: string}
    TrackingUuid:
      name: trackingUuid
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
        device_name: {type: string, maxLength: 100}
    LoginResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user: {$ref: '#/components/schemas/User'}
            token: {type: string}
            token_type: {type: string, const: Bearer}
    CandidateRegistrationRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: {type: string, maxLength: 160}
        email: {type: string, format: email}
        phone: {type: string, maxLength: 40}
        password: {type: string, minLength: 10}
        password_confirmation: {type: string}
        locale: {type: string, enum: [fr, ar, en]}
    OrganizationRegistrationRequest:
      type: object
      required:
        - owner_name
        - owner_email
        - password
        - password_confirmation
        - organization_name
        - organization_type
        - country_code
        - city
        - registry_number
        - description
        - cause_ids
      properties:
        owner_name: {type: string}
        owner_email: {type: string, format: email}
        password: {type: string, minLength: 10}
        password_confirmation: {type: string}
        organization_name: {type: string}
        organization_type: {type: string, enum: [association, foundation, ngo, waqf]}
        country_code: {type: string, minLength: 2, maxLength: 2}
        city: {type: string}
        registry_number: {type: string}
        size: {type: string, enum: [micro, small, medium, large]}
        description: {type: string}
        mission: {type: string}
        website: {type: string, format: uri}
        cause_ids:
          type: array
          items: {type: integer}
        documents:
          type: array
          items: {type: string, format: binary}
        document_types:
          type: array
          items: {type: string}
    User:
      type: object
      required: [id, name, email, role, status]
      properties:
        id: {type: integer}
        name: {type: string}
        email: {type: string, format: email}
        phone: {anyOf: [{type: string}, {type: 'null'}]}
        role: {type: string}
        role_label: {type: string}
        status: {type: string}
        locale: {type: string}
        email_verified_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
        created_at: {type: string, format: date-time}
    Country:
      type: object
      properties:
        code: {type: string}
        name_fr: {type: string}
    Cause:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        slug: {type: string}
    EngagementType:
      type: string
      enum: [volunteering, employment, freelance, consulting, governance, skills_sponsorship]
    RemoteMode:
      type: string
      enum: [on_site, hybrid, remote]
    Verification:
      type: object
      properties:
        status: {type: string, enum: [pending, verified, certified_plus, rejected]}
        label: {type: string}
    OrganizationSummary:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        slug: {type: string}
        type: {type: string}
        location:
          type: object
          properties:
            country_code: {type: string}
            country: {type: string}
            city: {type: string}
        description: {type: string}
        verification: {$ref: '#/components/schemas/Verification'}
        logo_url: {anyOf: [{type: string, format: uri}, {type: 'null'}]}
        causes:
          type: array
          items: {$ref: '#/components/schemas/Cause'}
        open_offers_count: {type: integer}
    Organization:
      allOf:
        - $ref: '#/components/schemas/OrganizationSummary'
        - type: object
          properties:
            registry_number: {type: string}
            size: {type: string}
            mission: {type: string}
            website: {type: string}
            founded_year: {type: integer}
            volunteer_count: {type: integer}
            offers:
              type: array
              items: {$ref: '#/components/schemas/OfferSummary'}
    OfferSummary:
      type: object
      properties:
        id: {type: integer}
        uuid: {type: string, format: uuid}
        slug: {type: string}
        title: {type: string}
        engagement_type:
          type: object
          properties:
            value: {$ref: '#/components/schemas/EngagementType'}
            label: {type: string}
        employment_contract: {anyOf: [{type: string}, {type: 'null'}]}
        location:
          type: object
          properties:
            country_code: {type: string}
            country: {type: string}
            region: {type: string}
            city: {type: string}
            label: {type: string}
            distance_km: {type: number}
        remote_mode:
          type: object
          properties:
            value: {$ref: '#/components/schemas/RemoteMode'}
            label: {type: string}
        duration_label: {type: string}
        experience_level: {type: string}
        featured: {type: boolean}
        published_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        organization: {$ref: '#/components/schemas/OrganizationSummary'}
        causes:
          type: array
          items: {$ref: '#/components/schemas/Cause'}
        languages:
          type: array
          items:
            type: object
            properties:
              code: {type: string}
              name: {type: string}
        skills:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              slug: {type: string}
              required: {type: boolean}
    Offer:
      allOf:
        - $ref: '#/components/schemas/OfferSummary'
        - type: object
          properties:
            description: {type: string}
            responsibilities: {type: string}
            desired_profile: {type: string}
            conditions: {type: string}
            start_date: {type: string, format: date}
            end_date: {type: string, format: date}
            views_count: {type: integer}
            is_saved: {type: boolean}
            has_applied: {type: boolean}
    SponsorshipMissionRequest:
      type: object
      required: [contact_email, company_name, title, man_days, visibility, consent]
      properties:
        contact_email: {type: string, format: email}
        company_name: {type: string, maxLength: 180}
        company_legal_id: {type: string}
        country_code: {type: string, minLength: 2, maxLength: 2}
        region: {type: string}
        title: {type: string, maxLength: 180}
        description: {type: string, maxLength: 5000}
        objectives: {type: string, maxLength: 5000}
        deliverables: {type: string, maxLength: 5000}
        required_profiles: {type: string, maxLength: 5000}
        man_days: {type: integer, minimum: 1, maximum: 10000}
        visibility: {type: string, enum: [open, verified_organizations, confidential]}
        cause_ids:
          type: array
          maxItems: 10
          items: {type: integer}
        consent: {type: boolean}
        website:
          type: string
          maxLength: 0
          description: Honeypot; must be empty.
    SponsorshipMission:
      type: object
      properties:
        tracking_uuid: {type: string, format: uuid}
        contact_email: {type: string, format: email}
        company_name: {type: string}
        company_legal_id: {type: string}
        country_code: {type: string}
        region: {type: string}
        title: {type: string}
        description: {type: string}
        objectives: {type: string}
        deliverables: {type: string}
        required_profiles: {type: string}
        man_days: {type: integer}
        visibility: {type: string}
        status: {type: string}
        verified_email_at: {anyOf: [{type: string, format: date-time}, {type: 'null'}]}
        causes:
          type: array
          items: {$ref: '#/components/schemas/Cause'}
        created_at: {type: string, format: date-time}
    SponsorSlot:
      type: object
      properties:
        id: {type: integer}
        placement: {type: string}
        sponsor_name: {type: string}
        label: {type: string}
        copy: {type: string}
        target_url: {anyOf: [{type: string, format: uri}, {type: 'null'}]}
    PaginationLinks:
      type: object
      properties:
        first: {type: string, format: uri}
        last: {type: string, format: uri}
        prev: {anyOf: [{type: string, format: uri}, {type: 'null'}]}
        next: {anyOf: [{type: string, format: uri}, {type: 'null'}]}
    PaginationMeta:
      type: object
      properties:
        current_page: {type: integer}
        from: {type: integer}
        last_page: {type: integer}
        per_page: {type: integer}
        to: {type: integer}
        total: {type: integer}
    PaginatedOffers:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/OfferSummary'}
        links: {$ref: '#/components/schemas/PaginationLinks'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    PaginatedOrganizations:
      type: object
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/OrganizationSummary'}
        links: {$ref: '#/components/schemas/PaginationLinks'}
        meta: {$ref: '#/components/schemas/PaginationMeta'}
    Error:
      type: object
      properties:
        message: {type: string}
    ValidationError:
      type: object
      properties:
        message: {type: string}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
