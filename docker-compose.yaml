services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres16
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_ong:/var/lib/postgresql/data

volumes:
  postgres_ong:
